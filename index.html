<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>软件库 - 开源 Android 应用合集</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0d1117; color: #c9d1d9; min-height: 100vh; }
.header { background: #161b22; border-bottom: 1px solid #30363d; padding: 16px 24px; position: sticky; top: 0; z-index: 10; }
.header h1 { font-size: 22px; color: #58a6ff; }
.header p { font-size: 13px; color: #8b949e; margin-top: 4px; }
.tabs { display: flex; gap: 8px; padding: 16px 24px 0; background: #0d1117; }
.tab { padding: 8px 20px; border: 1px solid #30363d; border-radius: 6px 6px 0 0; background: #161b22; color: #8b949e; cursor: pointer; font-size: 14px; border-bottom: none; }
.tab.active { background: #1c2128; color: #58a6ff; border-color: #30363d #30363d #1c2128; }
.container { max-width: 1000px; margin: 0 auto; padding: 0 24px 40px; background: #1c2128; border: 1px solid #30363d; border-top: none; border-radius: 0 6px 6px 6px; }
.app-list { padding: 16px 0; }
.app-item { display: flex; align-items: center; gap: 16px; padding: 14px 0; border-bottom: 1px solid #21262d; }
.app-item:last-child { border-bottom: none; }
.app-icon { width: 48px; height: 48px; border-radius: 10px; background: #21262d; display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; overflow: hidden; }
.app-icon img { width: 100%; height: 100%; object-fit: cover; }
.app-info { flex: 1; min-width: 0; }
.app-name { font-size: 15px; font-weight: 600; color: #58a6ff; text-decoration: none; }
.app-name:hover { text-decoration: underline; }
.app-desc { font-size: 13px; color: #8b949e; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.app-meta { font-size: 12px; color: #6e7681; margin-top: 3px; display: flex; gap: 12px; flex-wrap: wrap; }
.app-meta span { white-space: nowrap; }
.app-download { flex-shrink: 0; padding: 6px 16px; background: #238636; color: #fff; border-radius: 6px; text-decoration: none; font-size: 13px; font-weight: 500; }
.app-download:hover { background: #2ea043; }
.loading { text-align: center; padding: 60px 20px; color: #8b949e; }
.error { text-align: center; padding: 60px 20px; color: #f85149; }
.stats { padding: 12px 0; font-size: 13px; color: #8b949e; }
footer { text-align: center; padding: 20px; font-size: 12px; color: #484f58; }
footer a { color: #484f58; }
@media (max-width: 600px) {
  .app-item { flex-wrap: wrap; }
  .app-download { width: 100%; text-align: center; margin-top: 8px; }
  .tabs { padding: 12px 12px 0; }
  .container { padding: 0 12px 24px; }
}
</style>
</head>
<body>
<div class="header">
  <h1>📦 软件库</h1>
  <p>GitHub 开源 Android 应用自动收录 · 每日更新</p>
</div>
<div class="tabs">
  <div class="tab active" onclick="switchTab('most-popular')">🔥 最受欢迎</div>
  <div class="tab" onclick="switchTab('trending')">📈 趋势上升</div>
  <div class="tab" onclick="switchTab('new-releases')">🆕 最新发布</div>
</div>
<div class="container">
  <div class="stats" id="stats"></div>
  <div class="app-list" id="appList"></div>
  <div class="loading" id="loading">⏳ 加载中...</div>
</div>
<footer>
  数据来源 <a href="https://github.com/skyxiaoxia/komi-store-backend-data" target="_blank">GitHub</a> ·
  每日自动更新 ·
  Powered by <a href="https://github.com/kurikomi-labs/komi-store" target="_blank">Komi Store</a>
</footer>

<script>
const BASE = 'https://raw.githubusercontent.com/skyxiaoxia/komi-store-backend-data/main/cached-data';
let currentTab = 'most-popular';

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelector(`.tab:nth-child(${tab === 'most-popular' ? 1 : tab === 'trending' ? 2 : 3})`).classList.add('active');
  loadData();
}

async function loadData() {
  const list = document.getElementById('appList');
  const loading = document.getElementById('loading');
  const stats = document.getElementById('stats');
  list.innerHTML = '';
  loading.style.display = 'block';
  stats.textContent = '';

  try {
    const resp = await fetch(`${BASE}/${currentTab}/android.json`);
    if (!resp.ok) throw new Error('数据加载失败');
    const data = await resp.json();

    loading.style.display = 'none';
    const updateDate = new Date(data.lastUpdated).toLocaleDateString('zh-CN');
    stats.textContent = `共 ${data.totalCount} 个应用 · 更新于 ${updateDate}`;

    data.repositories.forEach(repo => {
      const item = document.createElement('div');
      item.className = 'app-item';

      const stars = repo.stargazersCount >= 1000
        ? (repo.stargazersCount / 1000).toFixed(1) + 'k'
        : repo.stargazersCount;

      const lang = repo.language || '?';
      const releaseDate = repo.latestReleaseDate
        ? new Date(repo.latestReleaseDate).toLocaleDateString('zh-CN')
        : '未知';
      const desc = repo.description || '暂无描述';

      item.innerHTML = `
        <div class="app-icon">
          <img src="${repo.owner?.avatarUrl || ''}" alt="" onerror="this.style.display='none';this.parentElement.textContent='📱'">
        </div>
        <div class="app-info">
          <a class="app-name" href="https://github.com/${repo.fullName}" target="_blank">${repo.fullName}</a>
          <div class="app-desc">${desc}</div>
          <div class="app-meta">
            <span>⭐ ${stars}</span>
            <span>🔧 ${lang}</span>
            <span>📅 ${releaseDate}</span>
            ${repo.topics && repo.topics.slice(0, 2).map(t => `<span>🏷 ${t}</span>`).join('')}
          </div>
        </div>
        <a class="app-download" href="https://github.com/${repo.fullName}/releases" target="_blank">下载</a>
      `;
      list.appendChild(item);
    });
  } catch (e) {
    loading.style.display = 'none';
    list.innerHTML = '<div class="error">❌ 数据加载失败，请稍后重试<br><small>提示：首次运行需要等待 GitHub Actions 完成爬取</small></div>';
    console.error(e);
  }
}

loadData();
</script>
</body>
</html>
